<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B68EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#grad1)"/>
  
  <!-- 3D cube representation -->
  <g transform="translate(128, 128)" filter="url(#shadow)">
    <!-- Back face -->
    <polygon points="64,64 192,64 192,192 64,192" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.9)" stroke-width="4"/>
    
    <!-- Top face -->
    <polygon points="64,64 128,0 256,0 192,64" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.9)" stroke-width="4"/>
    
    <!-- Right face -->
    <polygon points="192,64 256,0 256,128 192,192" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.9)" stroke-width="4"/>
    
    <!-- Data points with different sizes and colors -->
    <circle cx="96" cy="96" r="8" fill="#FFD700" opacity="0.9"/>
    <circle cx="160" cy="128" r="6" fill="#FF6B6B" opacity="0.9"/>
    <circle cx="224" cy="96" r="7" fill="#4ECDC4" opacity="0.9"/>
    <circle cx="128" cy="160" r="5" fill="#45B7D1" opacity="0.9"/>
    <circle cx="192" cy="160" r="4" fill="#FF8C42" opacity="0.9"/>
    <circle cx="144" cy="112" r="3" fill="#A8E6CF" opacity="0.9"/>
    <circle cx="176" cy="144" r="2.5" fill="#FF69B4" opacity="0.9"/>
    <circle cx="112" cy="144" r="3.5" fill="#20B2AA" opacity="0.9"/>
  </g>
  
  <!-- Text overlay -->
  <text x="256" y="440" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold" opacity="0.9">
    Beliveau 3D Visualizer
  </text>
</svg>
