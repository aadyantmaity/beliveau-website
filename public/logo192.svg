<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B68EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="24" fill="url(#grad1)"/>
  
  <!-- 3D cube representation -->
  <g transform="translate(48, 48)" filter="url(#shadow)">
    <!-- Back face -->
    <polygon points="24,24 72,24 72,72 24,72" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    
    <!-- Top face -->
    <polygon points="24,24 48,0 96,0 72,24" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    
    <!-- Right face -->
    <polygon points="72,24 96,0 96,48 72,72" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    
    <!-- Data points with different sizes and colors -->
    <circle cx="36" cy="36" r="4" fill="#FFD700" opacity="0.9"/>
    <circle cx="60" cy="48" r="3" fill="#FF6B6B" opacity="0.9"/>
    <circle cx="84" cy="36" r="3.5" fill="#4ECDC4" opacity="0.9"/>
    <circle cx="48" cy="60" r="2.5" fill="#45B7D1" opacity="0.9"/>
    <circle cx="72" cy="60" r="2" fill="#FF8C42" opacity="0.9"/>
    <circle cx="54" cy="42" r="1.5" fill="#A8E6CF" opacity="0.9"/>
  </g>
  
  <!-- Text overlay -->
  <text x="96" y="160" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" opacity="0.9">
    Beliveau 3D
  </text>
</svg>
