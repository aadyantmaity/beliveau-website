<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Test tube body -->
  <rect x="12" y="6" width="8" height="18" rx="4" ry="4" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Test tube bottom (rounded) -->
  <ellipse cx="16" cy="24" rx="4" ry="2" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Liquid inside test tube -->
  <rect x="13" y="12" width="6" height="10" rx="3" ry="3" fill="black"/>
  
  <!-- Bubbles in liquid -->
  <circle cx="15" cy="16" r="0.8" fill="white"/>
  <circle cx="17" cy="18" r="0.6" fill="white"/>
  <circle cx="14" cy="20" r="0.5" fill="white"/>
  
  <!-- Test tube opening -->
  <ellipse cx="16" cy="6" rx="4" ry="1" fill="none" stroke="black" stroke-width="1"/>
</svg>
