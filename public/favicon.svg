<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad1)" stroke="#2C3E50" stroke-width="1"/>
  
  <!-- 3D cube representation -->
  <g transform="translate(8, 8)">
    <!-- Back face -->
    <polygon points="4,4 12,4 12,12 4,12" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.8)" stroke-width="0.5"/>
    
    <!-- Top face -->
    <polygon points="4,4 8,0 16,0 12,4" fill="rgba(255,255,255,0.5)" stroke="rgba(255,255,255,0.8)" stroke-width="0.5"/>
    
    <!-- Right face -->
    <polygon points="12,4 16,0 16,8 12,12" fill="rgba(255,255,255,0.4)" stroke="rgba(255,255,255,0.8)" stroke-width="0.5"/>
    
    <!-- Data points -->
    <circle cx="6" cy="6" r="0.8" fill="#FFD700"/>
    <circle cx="10" cy="8" r="0.6" fill="#FF6B6B"/>
    <circle cx="14" cy="6" r="0.7" fill="#4ECDC4"/>
    <circle cx="8" cy="10" r="0.5" fill="#45B7D1"/>
  </g>
</svg>
